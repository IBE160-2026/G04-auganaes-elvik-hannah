# Story 1.7: deletes the PR's Neon preview branch when the PR is closed or merged.
# Vercel's Neon integration names it preview/<git-branch>. The free plan allows 10 branches.
# Needs the repository variable NEON_PROJECT_ID and the secret NEON_API_KEY; skipped without them.
name: Slett Neon-forhåndsvisningsgren

on:
  pull_request:
    types: [closed]

# The job uses only the Neon API key, never the GitHub token.
permissions: {}

jobs:
  delete-neon-branch:
    if: ${{ vars.NEON_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Slett preview/${{ github.head_ref }}
        uses: neondatabase/delete-branch-action@v3
        # A PR may never have had a branch (e.g. no preview was built), so a miss is not a failure.
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
