# Issue #9 (deferred R7 from Story 1.7): tests, lint and build on every PR and on main.
# Needs no secrets or accounts, like local running (AD-15).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the run that is still going. On main every merge commit
# gets a finished run, since Vercel builds and migrates production from it (Epic 1 retro, R3).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (pytest, ruff) – ${{ matrix.os }}
    # Windows too, since the team and likely the examiner run the app there (README: Git Bash).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only exact version tags, no moving v10 tag.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  migrations:
    name: Migreringer (Postgres 18)
    runs-on: ubuntu-latest
    # Linux only: GitHub's Windows runners cannot run the Postgres service container.
    # Same major version as Neon and docker-compose.yml.
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: husly
          POSTGRES_PASSWORD: husly
          POSTGRES_DB: husly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U husly -d husly"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # Story 1.6: the seed command applies the migrations, then the example data.
      # Uses the local default URL (localhost:5433), the same as README.
      - run: uv run python -m app.seed
      # Proves the migration transaction committed (the advisory-lock pitfall from Story 1.7).
      - name: alembic_version finnes
        run: >-
          uv run python -c "from sqlalchemy import create_engine, inspect;
          from app.config import get_database_url;
          assert inspect(create_engine(get_database_url())).has_table('alembic_version')"
      # Story 1.6: a second run must exit 0 and create nothing new.
      - run: uv run python -m app.seed
      # Story 1.3: plus the example Home with Mari and Jonas as its two Members.
      # Story 1.4: plus Kari's Landlord Home, which Anders joined through one invite link.
      # Story 2.1: plus eight Tasks in each Home, each with one TaskInstance.
      # Story 2.4: plus Jonas's one completion, which adds the next instance (17 instances).
      - name: Seed er idempotent (fire brukere, to hjem, fire medlemskap, én lenke, 16 oppgaver)
        run: |
          uv run python - <<'EOF'
          from sqlalchemy import create_engine, text
          from app.config import get_database_url
          from app.seed.users import EXAMPLE_USERS
          with create_engine(get_database_url()).connect() as c:
              n = c.execute(text("SELECT count(*) FROM users")).scalar_one()
              homes = c.execute(text("SELECT count(*) FROM homes")).scalar_one()
              members = c.execute(text("SELECT count(*) FROM memberships")).scalar_one()
              links = c.execute(text("SELECT count(*) FROM invite_links")).scalar_one()
              tasks = c.execute(text("SELECT count(*) FROM tasks")).scalar_one()
              instances = c.execute(text("SELECT count(*) FROM task_instances")).scalar_one()
          assert n == len(EXAMPLE_USERS) == 4, n
          assert (homes, members, links) == (2, 4, 1), (homes, members, links)
          assert (tasks, instances) == (16, 17), (tasks, instances)
          EOF
      # Story 1.5 (FR-3, decision 2): the same "never mixed" check as the tests, on Postgres.
      - name: Ingen hjem blander roller (FR-3)
        run: |
          uv run python - <<'EOF'
          from sqlmodel import Session, create_engine
          from app.config import get_database_url
          from app.domain.homes import fr3_violations
          with Session(create_engine(get_database_url())) as session:
              bad = fr3_violations(session)
          assert bad == [], bad
          EOF
      # Story 1.3: alembic check ignores CHECK constraints, so prove the migrated schema has them.
      - name: CHECK-constraints finnes i migrert skjema
        run: |
          uv run python - <<'EOF'
          import uuid
          from sqlalchemy import create_engine, text
          from sqlalchemy.exc import IntegrityError
          from app.config import get_database_url
          cases = [
              ("ck_homes_type",
               "INSERT INTO homes (id, name, type, created_at) VALUES (:h, 'x', 'other', now())"),
              ("ck_memberships_role",
               "INSERT INTO memberships (id, user_id, home_id, role, created_at) "
               "SELECT :h, m.user_id, m.home_id, 'owner', now() FROM memberships m LIMIT 1"),
              # Story 1.4: a link never makes a Landlord.
              ("ck_invite_links_role",
               "INSERT INTO invite_links (id, home_id, role, token_hash, created_by_user_id, "
               "created_at, expires_at) "
               "SELECT :h, m.home_id, 'landlord', 'x', m.user_id, now(), now() "
               "FROM memberships m LIMIT 1"),
              # Story 2.1: every Task is Must or Should and has a positive Frequency.
              ("ck_tasks_classification",
               "INSERT INTO tasks (id, home_id, task_type, name, classification, frequency_days, "
               "created_at) SELECT :h, h.id, 'x', 'x', 'maybe', 7, now() FROM homes h LIMIT 1"),
              ("ck_tasks_frequency_days",
               "INSERT INTO tasks (id, home_id, task_type, name, classification, frequency_days, "
               "created_at) SELECT :h, h.id, 'x', 'x', 'must', 0, now() FROM homes h LIMIT 1"),
              # Story 2.4: completed_at and completed_by_user_id are set together.
              ("ck_task_instances_completion",
               "INSERT INTO task_instances (id, task_id, due_on, created_at, completed_at) "
               "SELECT :h, t.id, current_date, now(), now() FROM tasks t LIMIT 1"),
              ("ck_task_instances_completion",
               "INSERT INTO task_instances (id, task_id, due_on, created_at, "
               "completed_by_user_id) SELECT :h, t.id, current_date, now(), m.user_id "
               "FROM tasks t JOIN memberships m ON m.home_id = t.home_id LIMIT 1"),
              # Story 2.4: alembic check ignores the index's WHERE, so prove a second open
              # instance of a Task is refused.
              ("uq_task_instances_open_task_id",
               "INSERT INTO task_instances (id, task_id, due_on, created_at) "
               "SELECT :h, i.task_id, i.due_on + 1, now() FROM task_instances i "
               "WHERE i.completed_at IS NULL LIMIT 1"),
              # Story 2.6: the same for the partial unique indexes on active Tasks: a second
              # active Task of a catalog type, or with the same name in other case, is refused.
              ("uq_tasks_active_home_id_task_type",
               "INSERT INTO tasks (id, home_id, task_type, name, classification, frequency_days, "
               "created_at) SELECT :h, t.home_id, t.task_type, 'Annet navn', 'should', 7, now() "
               "FROM tasks t WHERE t.archived_at IS NULL AND t.task_type IS NOT NULL LIMIT 1"),
              ("uq_tasks_active_home_id_lower_name",
               "INSERT INTO tasks (id, home_id, task_type, name, classification, frequency_days, "
               "created_at) SELECT :h, t.home_id, NULL, upper(t.name), 'should', 7, now() "
               "FROM tasks t WHERE t.archived_at IS NULL LIMIT 1"),
          ]
          with create_engine(get_database_url()).connect() as c:
              for name, sql in cases:
                  try:
                      c.execute(text(sql), {"h": uuid.uuid4()})
                  except IntegrityError as exc:
                      assert name in str(exc.orig), exc.orig
                  else:
                      raise AssertionError(f"{name} slapp gjennom")
                  finally:
                      c.rollback()
          EOF
      # Story 2.4: the partial index covers open instances only; a completed one may share the
      # open one's date (completed on setup day).
      - name: Fullført forekomst kan ha samme dato som den åpne
        run: |
          uv run python - <<'EOF'
          import uuid
          from sqlalchemy import create_engine, text
          from app.config import get_database_url
          with create_engine(get_database_url()).connect() as c:
              inserted = c.execute(
                  text(
                      "INSERT INTO task_instances (id, task_id, due_on, created_at, completed_at, "
                      "completed_by_user_id) SELECT :h, i.task_id, i.due_on, now(), now(), "
                      "m.user_id FROM task_instances i JOIN tasks t ON t.id = i.task_id "
                      "JOIN memberships m ON m.home_id = t.home_id "
                      "WHERE i.completed_at IS NULL LIMIT 1"
                  ),
                  {"h": uuid.uuid4()},
              )
              assert inserted.rowcount == 1, inserted.rowcount
              c.rollback()
          EOF
      # Story 2.6: the indexes cover active Tasks only; an archived Task may share the type and
      # name of an active one (a catalog type added again after archiving).
      - name: Arkivert oppgave kan ha samme type og navn som en aktiv
        run: |
          uv run python - <<'EOF'
          import uuid
          from sqlalchemy import create_engine, text
          from app.config import get_database_url
          with create_engine(get_database_url()).connect() as c:
              inserted = c.execute(
                  text(
                      "INSERT INTO tasks (id, home_id, task_type, name, classification, "
                      "frequency_days, created_at, archived_at) SELECT :h, t.home_id, t.task_type, "
                      "t.name, 'should', 7, now(), now() FROM tasks t "
                      "WHERE t.archived_at IS NULL AND t.task_type IS NOT NULL LIMIT 1"
                  ),
                  {"h": uuid.uuid4()},
              )
              assert inserted.rowcount == 1, inserted.rowcount
              c.rollback()
          EOF
      # Story 1.6: the real DB-down path (Alembic -> psycopg -> OperationalError) gives exit 1.
      - name: Seed uten database gir exit 1 og hint
        shell: bash
        run: |
          set +e
          DATABASE_URL=postgresql+psycopg://husly:husly@localhost:5999/husly \
            uv run python -m app.seed 2> seed-err.txt
          code=$?
          set -e
          cat seed-err.txt
          test "$code" -eq 1
          grep -qF "docker compose up -d --wait" seed-err.txt
      # Story 1.2: every migration must also downgrade cleanly, and upgrade again afterwards.
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      # Story 1.2: the migrated schema must match the SQLModel models (e.g. uq_users_email).
      - run: uv run alembic check

  frontend:
    name: Frontend (Vitest, eslint, build) – ${{ matrix.os }}
    # Windows too, since the team and likely the examiner run the app there (README: Git Bash).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Story 1.2: the committed client types must match frontend/openapi.json.
      - name: Generert API-klient er oppdatert
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
      # The service worker must sit unhashed at the site root to control the app (AD-12, Story 1.1).
      - name: service-worker.js i roten av dist
        run: test -f dist/service-worker.js
