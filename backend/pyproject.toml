[project]
name = "husly-backend"
version = "0.1.0"
description = "Husly API (FastAPI + SQLModel + Alembic)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.162.0",
    "sqlmodel==0.0.48",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.fastapi]
entrypoint = "app.main:app"
